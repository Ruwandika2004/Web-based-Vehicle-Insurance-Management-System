
server.port=8085
server.servlet.context-path=/

# H2 In-Memory Database (Standalone - No MySQL needed)
spring.datasource.url=jdbc:h2:mem:vehicle_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (browser access)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Jackson JSON Formatter
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Colombo
spring.jackson.serialization.write-dates-as-timestamps=false

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# File Upload Limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.saferide.insurance=INFO
logging.level.org.hibernate.SQL=DEBUG
