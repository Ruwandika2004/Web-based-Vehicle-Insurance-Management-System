<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Management | SafeRide Insurance</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=7">
  <link rel="stylesheet" href="/css/dashboard.css?v=7">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
        SafeRide <span>Insurance</span>
      </a>
      <div class="nav-actions">
        <span id="navUserName" style="font-weight: 600; color: var(--gray-700);"></span>
        <button class="btn btn-sm btn-secondary" onclick="API.logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>
  </nav>

  <div class="app-layout">
    <!-- Sidebar — dynamically built by API.initPortal() -->
    <aside class="sidebar">
      <div class="sidebar-user">
        <div style="font-weight: 700;" id="sidebarUserFullName">Loading...</div>
        <div class="form-text" id="sidebarUserEmail">...</div>
        <span class="user-role-badge" id="sidebarRoleBadge"></span>
      </div>
      <ul class="sidebar-menu" id="sidebarMenu"></ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <div class="page-title">
          <h1>Vehicle Fleet & Asset Registry</h1>
          <p>Register private passenger cars, commercial logistics fleets, and motorcycles with automated VIN and chassis validation.</p>
        </div>
        <div>
          <button class="btn btn-primary" id="btnOpenAddVehicle"><i class="fas fa-plus"></i> Register New Vehicle</button>
        </div>
      </div>

      <!-- Vehicle Cards Grid / Fleet View -->
      <div id="vehiclesList" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem;">
        <div style="grid-column: 1/-1; text-align: center; padding: 3rem;">Loading registered vehicles...</div>
      </div>
    </main>
  </div>

  <!-- Register Vehicle Modal -->
  <div class="modal-backdrop" id="vehicleModal">
    <div class="modal-content" style="max-width: 680px; max-height: 90vh; display: flex; flex-direction: column;">
      <div class="modal-header" style="flex-shrink: 0;">
        <h3 class="card-title"><i class="fas fa-car" style="color: var(--primary);"></i> Register New Vehicle</h3>
        <button class="modal-close" id="closeVehicleModal">&times;</button>
      </div>
      <form id="vehicleForm" style="display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; margin: 0;">
        <div class="modal-body" style="overflow-y: auto; max-height: calc(90vh - 135px); padding: 1.75rem;">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Vehicle Classification</label>
              <select class="form-select" id="vehType" required>
                <option value="PRIVATE_CAR">Private Passenger Car</option>
                <option value="COMMERCIAL_VEHICLE">Commercial Vehicle / Lorry / Van</option>
                <option value="MOTORCYCLE">Motorcycle / Two-Wheeler</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Manufacture Year</label>
              <input type="number" class="form-control" id="vehYear" min="1990" max="2026" value="2022" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Make / Manufacturer</label>
              <input type="text" class="form-control" id="vehMake" placeholder="e.g. Toyota, Honda, Isuzu" required>
            </div>
            <div class="form-group">
              <label class="form-label">Model</label>
              <input type="text" class="form-control" id="vehModel" placeholder="e.g. Prius, Civic, Elf" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Registration Number</label>
              <input type="text" class="form-control" id="vehRegNo" placeholder="e.g. WP-CAB-1234" required>
            </div>
            <div class="form-group">
              <label class="form-label">Chassis / VIN Number</label>
              <input type="text" class="form-control" id="vehChassis" placeholder="17-character VIN" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Engine Capacity (CC)</label>
              <input type="number" class="form-control" id="vehEngineCc" placeholder="e.g. 1500" required>
            </div>
            <div class="form-group">
              <label class="form-label">Fuel Type</label>
              <select class="form-select" id="vehFuel" required>
                <option value="PETROL">Petrol</option>
                <option value="DIESEL">Diesel</option>
                <option value="HYBRID">Hybrid</option>
                <option value="ELECTRIC">Electric (EV)</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Current Market Value (LKR)</label>
              <input type="number" class="form-control" id="vehMarketValue" placeholder="e.g. 8500000" required>
            </div>
            <div class="form-group">
              <label class="form-label">Current Odometer Mileage (km)</label>
              <input type="number" class="form-control" id="vehMileage" placeholder="e.g. 24000" required>
            </div>
          </div>

          <!-- Dynamic fields depending on vehicle type -->
          <div id="privateCarFields">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Seating Capacity</label>
                <input type="number" class="form-control" id="vehSeating" value="5">
              </div>
              <div class="form-group">
                <label class="form-label">Body Style</label>
                <select class="form-select" id="vehBodyType">
                  <option value="SEDAN">Sedan</option>
                  <option value="SUV">SUV / Crossover</option>
                  <option value="HATCHBACK">Hatchback</option>
                </select>
              </div>
            </div>
          </div>

          <div id="commercialFields" style="display: none;">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Tonnage Capacity (Tons)</label>
                <input type="number" step="0.1" class="form-control" id="vehTonnage" value="3.5">
              </div>
              <div class="form-group">
                <label class="form-label">Goods Permit Number</label>
                <input type="text" class="form-control" id="vehPermit" placeholder="GP-WP-XXXXX">
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer" style="flex-shrink: 0;">
          <button type="button" class="btn btn-secondary" id="btnCancelVeh">Cancel</button>
          <button type="submit" class="btn btn-primary"><i class="fas fa-check"></i> Register Vehicle</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Full Vehicle Edit Modal -->
  <div class="modal-backdrop" id="editVehicleModal">
    <div class="modal-content" style="max-width: 680px; max-height: 90vh; display: flex; flex-direction: column;">
      <div class="modal-header" style="flex-shrink: 0;">
        <h3 class="card-title"><i class="fas fa-car-side" style="color: var(--primary);"></i> Edit Vehicle Details</h3>
        <button class="modal-close" id="closeEditVehicleModal">&times;</button>
      </div>
      <form id="editVehicleForm" style="display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; margin: 0;">
        <input type="hidden" id="editVehId">
        <div class="modal-body" style="overflow-y: auto; max-height: calc(90vh - 135px); padding: 1.75rem;">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Vehicle Classification</label>
              <select class="form-select" id="editVehType" required>
                <option value="PRIVATE_CAR">Private Passenger Car</option>
                <option value="COMMERCIAL_VEHICLE">Commercial Vehicle / Lorry / Van</option>
                <option value="MOTORCYCLE">Motorcycle / Two-Wheeler</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Manufacture Year</label>
              <input type="number" class="form-control" id="editVehYear" min="1990" max="2026" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Make / Manufacturer</label>
              <input type="text" class="form-control" id="editVehMake" placeholder="e.g. Toyota, Honda" required>
            </div>
            <div class="form-group">
              <label class="form-label">Model</label>
              <input type="text" class="form-control" id="editVehModel" placeholder="e.g. Prius, Civic" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Registration Number</label>
              <input type="text" class="form-control" id="editVehRegNo" required>
            </div>
            <div class="form-group">
              <label class="form-label">Chassis / VIN Number</label>
              <input type="text" class="form-control" id="editVehChassis" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Engine Capacity (CC)</label>
              <input type="number" class="form-control" id="editVehEngineCc" required>
            </div>
            <div class="form-group">
              <label class="form-label">Fuel Type</label>
              <select class="form-select" id="editVehFuel" required>
                <option value="PETROL">Petrol</option>
                <option value="DIESEL">Diesel</option>
                <option value="HYBRID">Hybrid</option>
                <option value="ELECTRIC">Electric (EV)</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Current Market Value (LKR)</label>
              <input type="number" class="form-control" id="editVehMarketValue" required>
            </div>
            <div class="form-group">
              <label class="form-label">Current Odometer Mileage (km)</label>
              <input type="number" class="form-control" id="editVehMileage" required>
            </div>
          </div>
        </div>
        <div class="modal-footer" style="flex-shrink: 0;">
          <button type="button" class="btn btn-secondary" id="btnCancelEditVehicle">Cancel</button>
          <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Vehicle Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js?v=7"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = API.initPortal();
      if (!user) return;

      const addModal = document.getElementById('vehicleModal');
      const editModal = document.getElementById('editVehicleModal');
      const vehTypeSelect = document.getElementById('vehType');

      // Toggle dynamic fields on add form
      vehTypeSelect.addEventListener('change', () => {
        const val = vehTypeSelect.value;
        document.getElementById('privateCarFields').style.display = (val === 'PRIVATE_CAR') ? 'block' : 'none';
        document.getElementById('commercialFields').style.display = (val === 'COMMERCIAL_VEHICLE') ? 'block' : 'none';
      });

      // Add modal controls
      document.getElementById('btnOpenAddVehicle').addEventListener('click', () => addModal.classList.add('show'));
      document.getElementById('closeVehicleModal').addEventListener('click', () => addModal.classList.remove('show'));
      document.getElementById('btnCancelVeh').addEventListener('click', () => addModal.classList.remove('show'));

      // Full edit modal controls
      document.getElementById('closeEditVehicleModal').addEventListener('click', () => editModal.classList.remove('show'));
      document.getElementById('btnCancelEditVehicle').addEventListener('click', () => editModal.classList.remove('show'));

      // Fetch and render vehicle cards
      async function loadVehicles() {
        try {
          const res = await API.request('/vehicles/customer/' + user.id);
          const list = res.data || [];
          const container = document.getElementById('vehiclesList');

          if (list.length === 0) {
            container.innerHTML = `
              <div class="card" style="grid-column: 1/-1; text-align: center; padding: 3rem;">
                <i class="fas fa-car-side" style="font-size: 3rem; color: var(--gray-300); margin-bottom: 1rem;"></i>
                <h3>No Vehicles Registered Yet</h3>
                <p class="form-text" style="margin-bottom: 1.5rem;">Register your car, motorcycle, or commercial vehicle to buy policies and manage coverage.</p>
                <button class="btn btn-primary" onclick="document.getElementById('vehicleModal').classList.add('show')"><i class="fas fa-plus"></i> Register First Vehicle</button>
              </div>
            `;
            return;
          }

          container.innerHTML = list.map(v => {
            let icon = 'fa-car';
            if (v.vehicleType === 'MOTORCYCLE') icon = 'fa-motorcycle';
            if (v.vehicleType === 'COMMERCIAL_VEHICLE') icon = 'fa-truck';

            return `
              <div class="card">
                <div class="card-header">
                  <div class="card-title">
                    <i class="fas ${icon}" style="color: var(--primary-light);"></i>
                    ${v.make} ${v.model} (${v.manufactureYear})
                  </div>
                  <span class="badge badge-info">${v.vehicleType.replace('_', ' ')}</span>
                </div>
                <div style="font-size: 0.92rem; color: var(--gray-700); margin-bottom: 1.25rem;">
                  <p><strong>Registration:</strong> <code style="font-size: 1rem; color: var(--primary);">${v.registrationNumber}</code></p>
                  <p><strong>Chassis No:</strong> ${v.chassisNumber}</p>
                  <p><strong>Engine / Fuel:</strong> ${v.engineCapacityCc} CC | ${v.fuelType}</p>
                  <p><strong>Market Value:</strong> ${API.formatLKR(v.marketValue)}</p>
                  <p><strong>Current Mileage:</strong> ${Number(v.currentMileage).toLocaleString()} km</p>
                </div>
                <div style="display: flex; gap: 0.5rem; justify-content: space-between; border-top: 1px solid var(--gray-100); padding-top: 1rem;">
                  <button class="btn btn-sm btn-secondary" onclick="openEditVehicleModal(${v.id})">
                    <i class="fas fa-edit"></i> Edit Details
                  </button>
                  <button class="btn btn-sm btn-danger" onclick="deleteVehicle(${v.id}, '${v.registrationNumber}')">
                    <i class="fas fa-trash-alt"></i> Remove
                  </button>
                </div>
              </div>
            `;
          }).join('');
        } catch (err) {}
      }

      // Open full edit modal — fetch latest vehicle data by ID and pre-fill all fields
      window.openEditVehicleModal = async function(id) {
        try {
          const res = await API.request('/vehicles/' + id);
          const v = res.data;
          document.getElementById('editVehId').value = v.id;
          document.getElementById('editVehType').value = v.vehicleType;
          document.getElementById('editVehYear').value = v.manufactureYear;
          document.getElementById('editVehMake').value = v.make;
          document.getElementById('editVehModel').value = v.model;
          document.getElementById('editVehRegNo').value = v.registrationNumber;
          document.getElementById('editVehChassis').value = v.chassisNumber;
          document.getElementById('editVehEngineCc').value = v.engineCapacityCc;
          document.getElementById('editVehFuel').value = v.fuelType;
          document.getElementById('editVehMarketValue').value = v.marketValue;
          document.getElementById('editVehMileage').value = v.currentMileage;
          editModal.classList.add('show');
        } catch (err) {
          API.toast('Failed to load vehicle details', 'error');
        }
      };

      // Handle full vehicle edit form submit (PUT /api/vehicles/{id})
      document.getElementById('editVehicleForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('editVehId').value;
        const payload = {
          customerId: user.id,
          vehicleType: document.getElementById('editVehType').value,
          manufactureYear: parseInt(document.getElementById('editVehYear').value),
          make: document.getElementById('editVehMake').value.trim(),
          model: document.getElementById('editVehModel').value.trim(),
          registrationNumber: document.getElementById('editVehRegNo').value.trim(),
          chassisNumber: document.getElementById('editVehChassis').value.trim(),
          engineCapacityCc: parseInt(document.getElementById('editVehEngineCc').value),
          fuelType: document.getElementById('editVehFuel').value,
          marketValue: parseFloat(document.getElementById('editVehMarketValue').value),
          currentMileage: parseInt(document.getElementById('editVehMileage').value)
        };
        try {
          await API.request('/vehicles/' + id, {
            method: 'PUT',
            body: JSON.stringify(payload)
          });
          API.toast('Vehicle details updated successfully!', 'success');
          editModal.classList.remove('show');
          loadVehicles();
        } catch (err) {}
      });

      // Delete vehicle (DELETE /api/vehicles/{id})
      window.deleteVehicle = async function(id, regNo) {
        if (confirm(`Are you sure you want to remove vehicle ${regNo}? This action cannot be undone.`)) {
          try {
            await API.request('/vehicles/' + id, { method: 'DELETE' });
            API.toast('Vehicle ' + regNo + ' removed successfully', 'success');
            loadVehicles();
          } catch (err) {}
        }
      };

      // Handle Register New Vehicle form submit (POST /api/vehicles)
      document.getElementById('vehicleForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
          customerId: user.id,
          vehicleType: document.getElementById('vehType').value,
          make: document.getElementById('vehMake').value.trim(),
          model: document.getElementById('vehModel').value.trim(),
          manufactureYear: parseInt(document.getElementById('vehYear').value),
          registrationNumber: document.getElementById('vehRegNo').value.trim(),
          chassisNumber: document.getElementById('vehChassis').value.trim(),
          engineCapacityCc: parseInt(document.getElementById('vehEngineCc').value),
          fuelType: document.getElementById('vehFuel').value,
          marketValue: parseFloat(document.getElementById('vehMarketValue').value),
          currentMileage: parseInt(document.getElementById('vehMileage').value),
          seatingCapacity: parseInt(document.getElementById('vehSeating').value || 5),
          bodyType: document.getElementById('vehBodyType').value,
          tonnageCapacity: parseFloat(document.getElementById('vehTonnage').value || 0),
          goodsPermitNumber: document.getElementById('vehPermit').value.trim()
        };

        try {
          await API.request('/vehicles', {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          API.toast('Vehicle successfully registered to your fleet!', 'success');
          addModal.classList.remove('show');
          document.getElementById('vehicleForm').reset();
          loadVehicles();
        } catch (err) {}
      });

      loadVehicles();
    });
  </script>
</body>
</html>
